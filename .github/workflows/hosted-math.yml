name: Hosted mathematics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: hosted-math-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install browser and math comparison dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/hosted-deps" playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/hosted-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare actual GitHub mathematics
        env:
          NODE_PATH: ${{ runner.temp }}/hosted-deps/node_modules
          CHECKED_REPOSITORY: ${{ github.repository }}
          CHECKED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          node verification/hosted/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$CHECKED_REPOSITORY" \
            --revision "$CHECKED_REVISION" \
            --output "$RUNNER_TEMP/hosted-evidence" \
            --page README.md --page science/model.md
      - name: Retain source inventories and actual hosted captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hosted-evidence
          if-no-files-found: error
          retention-days: 7
